name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify no raw data or secret env files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.[^e])|\.(parquet|csv|tsv|zip)$'; then
            echo "Error: tracked secret or raw data file detected."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run Ruff lint and format checks
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Run tests (when tests/ exists)
        run: |
          if [ -d tests ]; then
            uv sync --dev
            uv run pytest
          else
            echo "No tests/ directory yet; skipping pytest."
          fi
